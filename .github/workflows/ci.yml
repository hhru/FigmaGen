name: "CI"

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  LC_CTYPE: en_US.UTF-8
  LANG: en_US.UTF-8
  SKIP_SWIFTLINT: YES

jobs:
  macOS:
    name: macOS
    runs-on: macOS-13
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.1.app/Contents/Developer
      SWIFTLINT_VERSION: 0.52.2
      DANGER_GITHUB_API_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
    steps:
      - uses: actions/checkout@v2
      - name: Ruby
        uses: ruby/setup-ruby@v1
      - name: Bundler
        run: |
          gem install bundler
          bundle install --without=documentation
      - name: Preparation
        run: set -o pipefail
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Test Demo
        run: make test_demo
      - name: Danger
        continue-on-error: true
        run: bundle exec danger --remove-previous-comments

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    container:
      image: swift:5.9
    steps:
      - uses: actions/checkout@v2
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libyaml-dev libffi-dev curl
      - name: Ruby
        uses: ruby/setup-ruby@v1
      - name: Bundler
        run: |
          gem install bundler
          bundle install --without=documentation
      - name: Preparation
        run: set -o pipefail
      - name: Build
        run: make build        
      - name: Test
        run: make test

  CocoaPods:
    name: CocoaPods
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v2
      - name: Ruby
        uses: ruby/setup-ruby@v1
      - name: Bundler
        run: |
          gem install bundler
          bundle install --without=documentation
      - name: Spec Lint
        continue-on-error: true
        run: bundle exec pod spec lint
      - name: Lib Lint
        run: bundle exec pod lib lint --skip-tests --allow-warnings --verbose
